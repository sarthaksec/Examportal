<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <link rel="stylesheet" href="/static/css/global.css">
</head>
<body>
    <div class="glass-container">
        <h2>Welcome Back</h2>
        <div style="color: #ef4444; text-align: center; margin-bottom: 15px; font-size: 0.9rem;">{{err}}</div>
        
        <form method="POST" action="/passive-log">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="mail" placeholder="Enter your email" required/>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="pass" placeholder="Enter your password" required/>
            </div>
            <button type="submit" class="btn">Login to Portal</button>
        </form>
        
        <div class="auth-links">
            Don't have an account? <a href="/">Register here</a>
        </div>
    </div>
</body>
</html>
