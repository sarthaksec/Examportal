<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate of Achievement</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .certificate {
            background: white;
            width: 800px;
            padding: 40px;
            border: 20px solid #1e293b;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .certificate::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 2px solid #cbd5e1;
            pointer-events: none;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: #1e293b;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }
        
        .presented-to {
            font-size: 1.1rem;
            color: #64748b;
            margin-bottom: 15px;
        }
        
        .name {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #3b82f6;
            margin-bottom: 30px;
            font-style: italic;
        }
        
        .description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #475569;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 60px;
            padding: 0 40px;
        }
        
        .signature-block {
            text-align: center;
        }
        
        .signature-line {
            width: 200px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 10px;
        }
        
        @media print {
            body { background: white; }
            .certificate { box-shadow: none; }
            .print-btn { display: none; }
        }

        .print-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <button class="print-btn" onclick="window.print()">Print Certificate</button>
    
    <div class="certificate">
        <h1>Certificate of Achievement</h1>
        <div class="subtitle">Examination Platform</div>
        
        <div class="presented-to">This is proudly presented to</div>
        
        <div class="name">{{ stud.name }}</div>
        
        <div class="description">
            For successfully completing the examination for year <strong>{{ stud.year }}</strong> with a score of <strong>{{ res.score }}</strong> out of <strong>{{ res.total }}</strong>.
        </div>
        
        <div class="footer">
            <div class="signature-block">
                <div class="signature-line"></div>
                <div>Date</div>
                <div style="color: #64748b; font-size: 0.9rem;">{{ res.date.strftime('%B %d, %Y') }}</div>
            </div>
            
            <div class="signature-block">
                <div class="signature-line"></div>
                <div>Director</div>
            </div>
        </div>
    </div>
</body>
</html>
