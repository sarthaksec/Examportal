<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Submitted</title>
    <link rel="stylesheet" href="/static/css/global.css">
</head>
<body>
    <div class="glass-container">
        <h2>Submission Successful</h2>
        
        <!-- Score Display -->
        <div style="background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 30px; text-align: center; margin-bottom: 25px;">
            <div style="font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 10px;">Your Score</div>
            <div style="font-size: 3rem; font-weight: 700; color: var(--accent);">{{score}}</div>
            <div style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 10px;">Great job completing the exam!</div>
        </div>

        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 25px;">
            Your exam has been successfully submitted and recorded. Thank you!
        </p>
        
        <div style="text-align: center;">
            <a href="/logout" style="text-decoration: none;">
                <button class="btn">Logout</button>
            </a>
        </div>
    </div>
</body>
</html>
