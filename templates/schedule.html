<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <script defer src="https://use.fontawesome.com/releases/v5.0.13/js/solid.js"></script>
    <script defer src="https://use.fontawesome.com/releases/v5.0.13/js/fontawesome.js"></script>
</head>
<body>
    <div class="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3>Admin Panel</h3>
            </div>
            <ul class="list-unstyled components">
                <li><a href="/dashboard"><b style="padding-left: 5px;">DASHBOARD</b></a></li>
                <li><a href="/allquestion">SY QUESTION</a></li>
                <li><a href="/tyquestion">TY QUESTION</a></li>
                <li><a href="/addquestion">ADD QUESTION</a></li>
                <li><a href="/schedule">SCHEDULE EXAM</a></li>
            </ul>
        </nav>

        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-info">
                        <i class="fas fa-align-left"></i>
                        <span>Press</span>
                    </button>                                       
                    <a href="/logout"><button class="btn btn-warning">Logout</button></a>
                </div>
            </nav>
            
            <div style="width: 400px; background-color:burlywood; padding: 20px; margin: auto;">
                <form action="/schedule" method="POST">
                    <h3 style="text-align: center;">Schedule Exam</h3>
                    
                    {% if msg %}
                    <div class="alert alert-success">{{msg}}</div>
                    {% endif %}

                    <label>Year : </label> 
                    <select name="year" class="form-control" required>
                        <option value="SY">SY</option>
                        <option value="TY">TY</option>
                    </select> <br>
                    
                    <label>Start Time : </label> 
                    <input type="datetime-local" name="start_time" class="form-control" required> <br>
                    
                    <label>End Time : </label> 
                    <input type="datetime-local" name="end_time" class="form-control" required> <br>
                    
                    <input type="submit" value="Set Schedule" class="btn btn-primary" style="width: 100%;">
                </form>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#sidebarCollapse').on('click', function () {
                $('#sidebar').toggleClass('active');
            });
        });
    </script>
</body>
</html>
